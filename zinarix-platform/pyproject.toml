[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zinarix-platform"
version = "0.1.0"
description = "Zinarix Core platform services and tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "dbus-next>=0.2.3",
  "PySide6>=6.6"
]

[project.scripts]
zinarixctl = "cli.main:main"
zinarix-control-center = "gui.control_center:main"
zinarix-mode = "cli.mode:main"
zinarix-health = "cli.health:main"
zinarix-drivers = "cli.drivers:main"
zinarix-repair = "cli.repair:main"
zinarix-security = "cli.security:main"
zinarix-app = "cli.app:main"
zinarix-snapshot = "cli.snapshot:main"
zinarix-firewall = "cli.firewall:main"

[tool.setuptools]
packages = [
  "core",
  "daemon",
  "api",
  "cli",
  "gui",
  "modules",
  "core",
  "modules.updater",
  "modules.drivers",
  "modules.profiles",
  "modules.creator",
  "modules.developer",
  "modules.security",
  "modules.gaming",
  "modules.recovery",
  "modules.snapshots",
  "modules.privacy",
  "modules.firewall"
]
