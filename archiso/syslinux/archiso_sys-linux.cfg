LABEL zinarix
TEXT HELP
Start Zinarix Live.
You can explore Zinarix and install it from the desktop.
ENDTEXT
MENU LABEL ^Zinarix Live
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL zinarixguest
TEXT HELP
Start Zinarix in Guest Mode.
Guest has no administrator privileges and its session is temporary.
ENDTEXT
MENU LABEL Zinarix ^Guest Mode
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% zinarix_guest=1

LABEL zinarixinstall
TEXT HELP
Start the Zinarix installer from the live desktop.
ENDTEXT
MENU LABEL Install Zinarix
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% zinarix_install=1

LABEL zinarixspeech
TEXT HELP
Start Zinarix with accessibility screen reader enabled.
ENDTEXT
MENU LABEL Zinarix Live with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
